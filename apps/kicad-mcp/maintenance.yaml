name: "KiCad Headless MCP"
app_type: "local_app"
upstream:
  base_image: "ubuntu:26.04"
  pip_file: "requirements.txt"
healthcheck:
  port: 8000
  endpoint: "/health"
  timeout_seconds: 30
security:
  cve_check: true
  secret_scan: true
  okf_required: false
docs:
  sync_changelog: true
  sync_readme: true
test_commands:
  - "PYTHONPATH=src /usr/local/bin/uv run --with pytest --with pytest-asyncio --with httpx --with-requirements requirements.txt pytest tests/"
