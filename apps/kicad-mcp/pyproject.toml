[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-mcp-app"
version = "0.2.0"
description = "Headless KiCad 9, ngspice, atopile & circuit-rule validation Streamable HTTP MCP server Home Assistant App"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.30.0",
    "fastmcp==3.4.11",
    "uvicorn[standard]==0.54.0",
    "starlette==1.10.0",
    "pydantic==2.14.4",
    "Pillow==13.0.0",
    "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
