[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-mcp-app"
version = "0.1.1"
description = "Headless KiCad 9 CLI & Streamable HTTP MCP server Home Assistant App"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "fastmcp>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
    "starlette>=1.3.1,<2",
    "pydantic>=2.0,<3",
    "Pillow>=13.0.0,<14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]
