name: "Ollama (Vulkan)"
version: "0.7.3"
slug: "ollama_vulkan"
description: "Ollama with Vulkan GPU support (Intel Arc/AMD). Optimized for private local LLM inference."
url: "https://github.com/matthijsberg/HomeAssistant-Apps/tree/main/apps/ollama"
startup: application
boot: auto
arch:
  - amd64
  - aarch64
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_PTRACE
full_access: true
devices:
  - /dev/dri:/dev/dri
ports:
  11434/tcp: 11434
  8099/tcp: 8099
ports_description:
  11434/tcp: "The Ollama API Port"
  8099/tcp: "Direct Web UI Port (direct LAN browser access)"
ingress: true
ingress_port: 8099
ingress_entry: /
ingress_stream: true
video: true
map:
  - config:rw
  - share:rw
options:
  model: "qwen3.5:2b"
  keep_alive: "5m"
  num_parallel: 1
  max_loaded_models: 0
  context_length: 8192
  gpu_overhead: 0
  log_level: "info"
  disable_fp16: false
  disable_bf16: false
  disable_flash_attention: false
  enable_vulkan: true
  custom_model_name: ""
watchdog: tcp://[HOST]:11434
schema:
  model: list(alfred|all-minilm|athene-v2|aya|aya-expanse|bakllava|bespoke-minicheck|bge-large|bge-m3|codebooga|codegeex4|codegemma|codellama|codeqwen|codestral|codeup|cogito|cogito-2.1|command-a|command-r|command-r-plus|command-r7b|command-r7b-arabic|dbrx|deepcoder|deepscaler|deepseek-coder|deepseek-coder-v2|deepseek-llm|deepseek-ocr|deepseek-r1|deepseek-v2|deepseek-v2.5|deepseek-v3|deepseek-v3.1|deepseek-v3.2|devstral|devstral-2|devstral-small-2|dolphin-llama3|dolphin-mistral|dolphin-mixtral|dolphin-phi|dolphin3|dolphincoder|duckdb-nsql|embeddinggemma|everythinglm|exaone-deep|exaone3.5|falcon|falcon2|falcon3|firefunction-v2|functiongemma|gemini-3-flash-preview|gemma|gemma2|gemma3|gemma3n|gemma4|gemma4:e4b|glm-4.6|glm-4.7|glm-4.7-flash|glm-5|glm-ocr|glm4|goliath|granite-code|granite-embedding|granite3-dense|granite3-guardian|granite3-moe|granite3.1-dense|granite3.1-moe|granite3.2|granite3.2-vision|granite3.3|granite4|gpt-oss|gpt-oss-safeguard|hermes3|internlm2|kimi-k2|kimi-k2-thinking|kimi-k2.5|lfm2|lfm2.5-thinking|llama-guard3|llama-pro|llama2|llama2-chinese|llama2-uncensored|llama3|llama3-chatqa|llama3-gradient|llama3-groq-tool-use|llama3.1|llama3.2|llama3.2-vision|llama3.3|llama4|llava|llava-llama3|llava-phi3|magicoder|magistral|marco-o1|mathstral|medllama2|meditron|megadolphin|minicpm-v|minimax-m2|minimax-m2.1|minimax-m2.5|minimax-m2.7|ministral-3|mistral|mistral-large|mistral-large-3|mistral-nemo|mistral-openorca|mistral-small|mistral-small3.1|mistral-small3.2|mistrallite|mixtral|moondream|mxbai-embed-large|nemotron|nemotron-3-nano|nemotron-3-super|nemotron-cascade-2|nemotron-mini|neural-chat|nexusraven|nomic-embed-text|nomic-embed-text-v2-moe|notus|notux|nous-hermes|nous-hermes2|nous-hermes2-mixtral|nuextract|olmo-3|olmo-3.1|olmo2|open-orca-platypus2|openchat|opencoder|openhermes|openthinker|orca-mini|orca2|paraphrase-multilingual|phi|phi3|phi3.5|phi4|phi4-mini|phi4-mini-reasoning|phi4-reasoning|phind-codellama|qwq|qwen|qwen2|qwen2-math|qwen2.5|qwen2.5-coder|