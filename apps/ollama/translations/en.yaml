configuration:
  model:
    name: Model
    description: "Primary LLM model to pull and preload (e.g. qwen2.5:1.5b, llama3.2:3b). Select 'Other' to use custom_model_name."
  custom_model_name:
    name: Custom Model Name
    description: "Custom model identifier or comma-separated list of models to preload when 'Other' is selected."
  keep_alive:
    name: Keep Alive Duration
    description: "Duration to keep models loaded in memory (e.g. 5m, 1h, 24h, or -1 for indefinite)."
  num_parallel:
    name: Parallel Requests
    description: "Maximum number of parallel requests Ollama will process simultaneously."
  max_loaded_models:
    name: Maximum Loaded Models
    description: "Maximum number of models loaded in memory simultaneously (0 = auto-manage based on available VRAM)."
  context_length:
    name: Context Length
    description: "Context window size in tokens (0 = model default, recommend 4096 or 8192 with Flash Attention)."
  gpu_overhead:
    name: GPU Overhead (MB)
    description: "Reserve VRAM margin in megabytes to prevent GPU out-of-memory errors."
  log_level:
    name: Log Level
    description: "Logging verbosity for Ollama (info, warning, debug, trace)."
  disable_fp16:
    name: Disable FP16
    description: "Force FP32 precision. Enable only if model outputs garbled text on your GPU."
  disable_bf16:
    name: Disable BF16
    description: "Disable Bfloat16 precision compute for models that have BF16 compatibility issues."
  disable_flash_attention:
    name: Disable Flash Attention
    description: "Disable Flash Attention. When false (default), Flash Attention and Q8_0 KV cache are enabled for lower memory."
  enable_vulkan:
    name: Enable Vulkan Acceleration
    description: "Enable experimental Vulkan hardware acceleration for Intel Arc and AMD GPUs."
