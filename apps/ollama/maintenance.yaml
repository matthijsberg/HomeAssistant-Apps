name: "Ollama (Vulkan)"
app_type: "upstream_wrapper"
upstream:
  github_repo: "ollama/ollama"
  docker_image: "ollama/ollama"
healthcheck:
  port: 11434
  endpoint: "/api/version"
  timeout_seconds: 30
security:
  cve_check: false
  secret_scan: true
  okf_required: true
docs:
  sync_changelog: true
  sync_readme: true
  sync_okf: true
test_commands:
  - "./scripts/validate_okf.sh"
