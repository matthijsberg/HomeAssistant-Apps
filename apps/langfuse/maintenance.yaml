name: "Langfuse"
app_type: "upstream_wrapper"
upstream:
  github_repo: "langfuse/langfuse"
  docker_image: "langfuse/langfuse"
healthcheck:
  port: 3000
  endpoint: "/api/public/health"
  timeout_seconds: 30
security:
  cve_check: false
  secret_scan: true
  okf_required: true
docs:
  sync_changelog: true
  sync_readme: true
  sync_okf: true
test_commands:
  - "/usr/bin/python3 scripts/test_config.py"
  - "./scripts/validate_okf.sh"
