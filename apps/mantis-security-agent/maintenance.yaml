name: "Mantis Security Agent"
app_type: "local_app"
upstream:
  base_image: "debian:bookworm-slim"
  pip_file: "requirements.txt"
healthcheck:
  port: 8000
  endpoint: "/health"
  timeout_seconds: 30
security:
  cve_check: true
  secret_scan: true
  okf_required: true
docs:
  sync_changelog: true
  sync_readme: true
  sync_okf: true
test_commands:
  - "PYTHONPATH=. /usr/local/bin/uv run --python 3.11 --with pytest --with-requirements requirements.txt pytest tests/"
