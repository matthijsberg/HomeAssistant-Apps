misconfigurations:
  - id: DS-0002
    statement: >-
      Home Assistant OS Supervisor mounts /data/options.json as 0600 root:root
      and /config with root ownership; s6-overlay/add-on entrypoints require root.
      Container isolation is enforced by HAOS AppArmor and cgroups.

vulnerabilities:
  # Upstream Langfuse (4.76.0 & 4.80.0) and Prisma ship deepmerge-ts 7.1.5
  - id: CVE-2026-40345
    paths:
      - "opt/langfuse-web-pristine/node_modules/.pnpm/deepmerge-ts@7.1.5/node_modules/deepmerge-ts/package.json"
      - "usr/local/lib/node_modules/prisma/node_modules/deepmerge-ts/package.json"
    expired_at: 2026-12-15
    statement: "Upstream Langfuse & Prisma transitive dependency; no upstream fix in 4.80.0 yet."

  # Upstream SeaweedFS 4.53 (latest release) includes golang.org/x/net v0.61.0
  - id: CVE-2026-78661
    paths:
      - "usr/bin/weed"
    expired_at: 2026-12-15
    statement: "Upstream SeaweedFS 4.53 is latest release; awaiting upstream Go dependency bump."

