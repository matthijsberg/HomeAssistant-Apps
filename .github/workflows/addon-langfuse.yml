name: Build Langfuse Add-on

on:
  push:
    branches:
      - main
    paths:
      - "apps/langfuse/**"
      - ".github/workflows/addon-langfuse.yml"
  pull_request:
    paths:
      - "apps/langfuse/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Scaffolding & Quality Checks
        run: |
          cd apps/langfuse
          ./scripts/setup.sh

      - name: Trivy Filesystem, Misconfig & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "apps/langfuse"
          scanners: "vuln,misconfig,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "table"
          exit-code: "1"

  security-scan-image:
    name: Container OS & Package Scan (Trivy)
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build local amd64 image for scanning
        run: |
          BUILD_FROM=$(python3 -c 'import yaml; print(yaml.safe_load(open("apps/langfuse/build.yaml"))["build_from"]["amd64"])')
          docker build --build-arg "BUILD_FROM=${BUILD_FROM}" -t local-langfuse:ci apps/langfuse

      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-langfuse:ci"
          vuln-type: "os,library"
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-langfuse.sarif"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-langfuse.sarif"
          category: "trivy-image-langfuse"

      - name: Enforce Trivy OS & Package CVE Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-langfuse:ci"
          vuln-type: "os,library"
          scanners: "vuln,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "table"
          exit-code: "1"

  build:
    name: Build & Publish GHCR Image
    needs: [lint-and-test, security-scan-image]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --target apps/langfuse \
            --image "{arch}-addon-langfuse" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --amd64 \
            --aarch64
