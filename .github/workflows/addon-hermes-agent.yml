name: Hermes Agent Add-on

on:
  push:
    branches:
      - main
    paths:
      - "apps/hermes-agent/**"
      - ".github/workflows/addon-hermes-agent.yml"
  pull_request:
    paths:
      - "apps/hermes-agent/**"
      - ".github/workflows/addon-hermes-agent.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruamel.yaml

      - name: Run quality gates
        run: |
          cd apps/hermes-agent
          ./scripts/setup.sh

      - name: Trivy Filesystem, Misconfig & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "apps/hermes-agent"
          scanners: "vuln,misconfig,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "table"
          exit-code: "1"
