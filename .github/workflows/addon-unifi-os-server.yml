name: UniFi OS Server Add-on

on:
  push:
    branches:
      - main
    paths:
      - "apps/unifi-os-server/**"
      - ".github/workflows/addon-unifi-os-server.yml"
  pull_request:
    paths:
      - "apps/unifi-os-server/**"
      - ".github/workflows/addon-unifi-os-server.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff

      - name: Run Scaffolding & Quality Checks
        run: |
          cd apps/unifi-os-server
          ./scripts/setup.sh

      - name: Trivy Filesystem, Misconfig & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "apps/unifi-os-server"
          scanners: "vuln,misconfig,secret"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "table"
          exit-code: "1"

  security-scan-image:
    name: Container OS & Package Scan (Trivy)
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space for UniFi OS image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true

      - name: Build local amd64 image for scanning
        run: |
          python3 - <<'PY'
          import subprocess, yaml
          from pathlib import Path

          app_dir = Path("apps/unifi-os-server")
          bld = yaml.safe_load((app_dir / "build.yaml").read_text()) or {}
          cmd = ["docker", "build", "-t", "local-unifi-os-server:ci"]
          amd64_from = (bld.get("build_from") or {}).get("amd64")
          if amd64_from:
              cmd.extend(["--build-arg", f"BUILD_FROM={amd64_from}"])
          for k, v in (bld.get("args") or {}).items():
              cmd.extend(["--build-arg", f"{k}={v}"])
          cmd.append(str(app_dir))
          print("Running:", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-unifi-os-server:ci"
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "sarif"
          output: "trivy-unifi-os-server.sarif"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-unifi-os-server.sarif"
          category: "trivy-image-unifi-os-server"

      - name: Enforce Trivy OS & Package CVE Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "local-unifi-os-server:ci"
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          format: "table"
          exit-code: "1"
