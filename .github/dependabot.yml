version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 1

  - package-ecosystem: "pip"
    directories:
      - "/apps/mantis-security-agent"
      - "/apps/kicad-mcp"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    groups:
      python-apps:
        patterns:
          - "*"
    ignore:
      # Pinned by Seeed-Studio/kicad-mcp-server upstream compatibility contract
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
      - dependency-name: "fastmcp"
        versions: [">=4.0.0"]
      # Blocked by semgrep==1.185.0 in mantis-security-agent (opentelemetry-api<1.38, jsonschema<4.26)
      - dependency-name: "fastapi"
        versions: [">=0.142.0"]
      - dependency-name: "jsonschema"
        versions: [">=4.26.0"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 1
